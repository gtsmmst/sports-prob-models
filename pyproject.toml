[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-prob-models"
version = "0.1.0"
description = "Probability models and bet-sizing math for sports markets (CS2, football, Kelly, arbitrage, edge). Pure Python, no runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gtsmmst" }]
keywords = ["sports", "probability", "poisson", "kelly", "arbitrage", "prediction-markets", "esports"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/gtsmmst/sports-prob-models"
Issues = "https://github.com/gtsmmst/sports-prob-models/issues"

[tool.setuptools.packages.find]
include = ["sports_prob_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
